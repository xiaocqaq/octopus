name: release

on:
  push:
    branches:
      - master
    paths:
      - main.go

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages_one_command: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish tag
        id: version
        run: |
          VERSION=$(grep '^// Version ' main.go | sed 's|^// Version ||' | tr -d ' ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Build
        run: bash scripts/build.sh

      - name: Generate changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/archives/*
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}

      # 此处原有 Docker meta / QEMU / Buildx / 推送镜像等步骤, 本 fork 已移除:
      # 只发布二进制, 不再需要 Docker Hub 凭据, 每次发版也省下多平台镜像构建的时间。
      # 与上游合并时若在此处冲突, 保留删除即可。
