name: release

on:
  push:
    branches:
      - master
    paths:
      - main.go

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages_one_command: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish tag
        id: version
        run: |
          VERSION=$(grep '^// Version ' main.go | sed 's|^// Version ||' | tr -d ' ')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 如果 tag 已存在则跳过创建, 避免重复发版时失败
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping tag creation"
          else
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Record build metadata
        id: metadata
        # 用无空格的 ISO 格式: 该值经 build-arg 注入 Dockerfile 的 -ldflags,
        # 含空格会被 go 的 -ldflags 解析切碎, 导致链接器报 usage 而构建失败;
        # 此格式同时匹配 internal/conf/banner.go formatDate 的 "2006-01-02T15:04:05Z" 布局。
        run: echo "build-time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Update price
        run: python3 scripts/updatePrice.py

      - name: Build
        run: bash scripts/build.sh

      - name: Generate changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release assets
        run: |
          test -s build/archives/SHA256SUMS
          test "$(find build/archives -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 7

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/archives/*.zip
            build/archives/SHA256SUMS
          prerelease: false
          tag_name: ${{ steps.version.outputs.version }}

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile
          push: true
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GITHUB_REPO=https://github.com/${{ github.repository }}
            BUILD_TIME=${{ steps.metadata.outputs.build-time }}
